<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <rect width="1200" height="630" fill="#1d2021"/>
  <rect x="0" y="0" width="1200" height="6" fill="#fb4934"/>

  <text x="80" y="90" fill="#928374" font-size="22" letter-spacing="3">THE ROW POINTS AT NOTHING</text>

  <g font-size="26">
    <text x="80" y="150" fill="#a89984">campaign_product_variants</text>
    <rect x="80" y="168" width="660" height="52" rx="6" fill="none" stroke="#665c54" stroke-width="1.5"/>
    <text x="100" y="202" fill="#ebdbb2">id=91  product_variant_id=4021  quota=294</text>
  </g>

  <g stroke="#665c54" stroke-width="2" stroke-dasharray="6 6">
    <line x1="230" y1="220" x2="230" y2="288"/>
    <polygon points="230,300 222,284 238,284" fill="#665c54" stroke="none"/>
  </g>

  <g font-size="26">
    <text x="80" y="336" fill="#a89984">product_variants where id = 4021</text>
    <rect x="80" y="354" width="300" height="52" rx="6" fill="none" stroke="#665c54" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="100" y="390" fill="#665c54" font-style="italic">(no row · deleted)</text>
  </g>

  <text x="80" y="470" fill="#928374" font-size="22" letter-spacing="3">THE POOL COUNTS IT ANYWAY</text>
  <g font-size="26">
    <text x="80" y="530" fill="#ebdbb2">SUM(quota) FROM campaign_product_variants</text>
    <rect x="80" y="548" width="660" height="52" rx="6" fill="#fb4934" opacity="0.16" stroke="#fb4934" stroke-width="1.5"/>
    <text x="100" y="584" fill="#fb4934">+294, no matching SKU required</text>
  </g>

  <text x="1120" y="120" fill="#a89984" font-size="30" text-anchor="end">14 orphan rows</text>
  <text x="1120" y="156" fill="#fb4934" font-size="30" text-anchor="end">294 units locked</text>
  <text x="1120" y="188" fill="#928374" font-size="22" text-anchor="end">no screen releases them</text>
</svg>
