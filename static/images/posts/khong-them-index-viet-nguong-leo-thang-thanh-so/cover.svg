<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <rect width="1200" height="630" fill="#1d2021"/>
  <rect x="0" y="0" width="1200" height="6" fill="#fb4934"/>

  <text x="60" y="64" fill="#928374" font-size="22" letter-spacing="3">THE THRESHOLD I WROTE vs THE CURVE I MEASURED</text>

  <!-- plot area: x 180..1060 (log rows), y 110..540 (log ms, 0.1..1000) -->
  <!-- y gridlines -->
  <g stroke="#3c3836" stroke-width="1">
    <line x1="150" y1="540" x2="1100" y2="540"/>
    <line x1="150" y1="432" x2="1100" y2="432"/>
    <line x1="150" y1="325" x2="1100" y2="325"/>
    <line x1="150" y1="217" x2="1100" y2="217"/>
    <line x1="150" y1="110" x2="1100" y2="110"/>
  </g>
  <g fill="#928374" font-size="22" text-anchor="end">
    <text x="138" y="548">0.1 ms</text>
    <text x="138" y="440">1</text>
    <text x="138" y="333">10</text>
    <text x="138" y="225">100</text>
    <text x="138" y="118">1000</text>
  </g>
  <!-- x ticks -->
  <g stroke="#504945" stroke-width="1">
    <line x1="180" y1="540" x2="180" y2="548"/>
    <line x1="640" y1="540" x2="640" y2="548"/>
    <line x1="1060" y1="540" x2="1060" y2="548"/>
  </g>
  <g fill="#928374" font-size="22" text-anchor="middle">
    <text x="180" y="580">3.2K rows</text>
    <text x="640" y="580">100K</text>
    <text x="1060" y="580">1M</text>
  </g>

  <!-- 300 ms threshold -->
  <line x1="150" y1="166" x2="1100" y2="166" stroke="#fabd2f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="160" y="158" fill="#fabd2f" font-size="22">p95 &gt; 300 ms</text>
  <!-- 1M rows threshold -->
  <line x1="1060" y1="110" x2="1060" y2="540" stroke="#fabd2f" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- extrapolation -->
  <polyline points="180,456 640,432 1060,325" fill="none" stroke="#83a598" stroke-width="3" stroke-dasharray="4 8"/>
  <text x="360" y="412" fill="#83a598" font-size="24">extrapolated: ~10 ms</text>

  <!-- measured 13.0 -->
  <polyline points="180,457 640,283 1060,199" fill="none" stroke="#fe8019" stroke-width="4"/>
  <g fill="#fe8019"><circle cx="180" cy="457" r="6"/><circle cx="640" cy="283" r="6"/><circle cx="1060" cy="199" r="6"/></g>
  <text x="1040" y="312" fill="#fe8019" font-size="24" text-anchor="end">MariaDB 13.0 · 148 ms at 1M</text>

  <!-- measured 10.11 -->
  <polyline points="180,393 640,256 1060,112" fill="none" stroke="#fb4934" stroke-width="4"/>
  <g fill="#fb4934"><circle cx="180" cy="393" r="6"/><circle cx="640" cy="256" r="6"/><circle cx="1060" cy="112" r="6"/></g>
  <text x="160" y="300" fill="#fb4934" font-size="24">10.11 · 968 ms at 1M</text>

  <!-- measured, non-unique index -->
  <polyline points="180,465 640,470 1060,462" fill="none" stroke="#8ec07c" stroke-width="3"/>
  <text x="200" y="510" fill="#8ec07c" font-size="22">with a non-unique index: flat, under 1 ms</text>

  <text x="60" y="618" fill="#665c54" font-size="20">median of 5 runs · no index · one correlated EXISTS · bench in the post</text>
</svg>
