<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <rect width="1200" height="630" fill="#1d2021"/>
  <rect x="0" y="0" width="1200" height="6" fill="#fb4934"/>

  <text x="80" y="96" fill="#928374" font-size="22" letter-spacing="3">WHAT THE SERVICE WROTE</text>
  <g font-size="30">
    <text x="80" y="160" fill="#ebdbb2">select * from "stock_pools" where "sku" = ? </text>
    <rect x="80" y="182" width="340" height="52" rx="6" fill="#fb4934" opacity="0.16" stroke="#fb4934" stroke-width="1.5"/>
    <text x="100" y="218" fill="#fb4934">for update</text>
  </g>

  <g stroke="#665c54" stroke-width="2">
    <line x1="140" y1="268" x2="140" y2="352"/>
    <polygon points="140,366 132,348 148,348" fill="#665c54" stroke="none"/>
  </g>
  <text x="172" y="322" fill="#928374" font-size="24">sqlite driver · compileLock() returns ""</text>

  <text x="80" y="432" fill="#928374" font-size="22" letter-spacing="3">WHAT SQLITE RAN</text>
  <g font-size="30">
    <text x="80" y="496" fill="#ebdbb2">select * from "stock_pools" where "sku" = ?</text>
    <rect x="80" y="518" width="340" height="52" rx="6" fill="none" stroke="#665c54" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="100" y="554" fill="#665c54" font-style="italic" font-size="26">(nothing)</text>
  </g>

  <text x="1120" y="572" fill="#a89984" font-size="30" text-anchor="end">1184 tests green</text>
  <text x="1120" y="604" fill="#fb4934" font-size="22" text-anchor="end">none of them could fail</text>
</svg>
